<!-- Top Bar -->
<div class="top-bar">
  <div class="container">
    <div class="row py-2 align-items-center">
      <div class="col-md-8">
        <div class="flex-wrap gap-3 contact-info d-flex">
          @if (contact()?.phone) {
          <span class="text-primary-custom contact-item">
            <i class="fa fa-phone me-2"></i>
            <a [href]="'tel:' + contact()?.phone" class="text-muted">
              {{ contact()?.phone }}
            </a>
          </span>
          }
          <!--  -->
          @if (contact()?.email) {
          <span class="text-primary-custom contact-item">
            <i class="fa fa-envelope me-2"></i>
            <a [href]="'mailto:' + contact()?.email" class="text-muted">
              {{ contact()?.email }}
            </a>
          </span>
          }
        </div>
      </div>
      <div class="col-md-4">
        <div class="top-links gap-3 d-flex justify-content-end align-items-center">
          <a class="mt-3 mt-md-0 btn btn-primary btn-sm" [href]="contact()?.webSite || '#'" target="_blank">
            العربية
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Main Header -->
<header class="bg-white shadow-sm site-header sticky-top">
  <div class="container">
    <div class="row py-3 align-items-center">
      <!-- Logo -->
      <div class="col-auto col-lg-2 d-flex align-items-center">
        <a routerLink="/" class="flex-column d-flex text-decoration-none logo d-flex align-items-center">
          @if (logo()) {
          <img [src]="logo()" alt="شعار كلية العلوم" class="logo-img me-3" />
          }

          <div class="">
            <span class="text-primary-custom site-title fw-bold">Faculty of Science</span>
          </div>
        </a>
      </div>

      <!-- Navigation -->
      <div class="col col-lg-10">
        <nav class="navbar navbar-expand-lg justify-content-end">
          <!-- Mobile Toggle -->

          <button class="navbar-toggler d-lg-none" type="button" (click)="toggleMobileMenu()"
            [class.active]="isMobileMenuOpen">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Mobile Backdrop -->
          <div class="mobile-backdrop d-lg-none" [class.show]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

          <!-- Navigation Links -->
          <div class="navbar-collapse" [class.show]="isMobileMenuOpen" [ngClass]="{ collapse: !isMobileMenuOpen }">
            <!-- Mobile Close Button -->
            <button class="btn-close-menu d-lg-none" (click)="closeMobileMenu()">
              <i class="fas fa-times"></i>
            </button>

            <ul class="navbar-nav">
              @for (item of menuItems(); track item.id) {
              <li class="nav-item">
                <a class="nav-link" [routerLink]="'/' + item.slug.toLowerCase()" routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: item.slug.toLowerCase() === 'home' }" (click)="closeMobileMenu()">
                  {{ item.title }}
                </a>
              </li>
              }
            </ul>
          </div>
        </nav>
      </div>
    </div>
  </div>
</header>
