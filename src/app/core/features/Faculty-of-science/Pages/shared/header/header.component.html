<!-- Top Bar -->
<div class="top-bar">
  <div class="container">
    <div class="row py-2 align-items-center">
      <div class="col-md-8">
        <div class="flex-wrap gap-3 contact-info d-flex">
          @if (contact()?.phone) {
            <span class="text-primary-custom contact-item">
              <i class="fa fa-phone me-2"></i>
              <a [href]="'tel:' + contact()?.phone" class="text-muted">
                {{ contact()?.phone }}
              </a>
            </span>
          }
          <!--  -->
          @if (contact()?.email) {
            <span class="text-primary-custom contact-item">
              <i class="fa fa-envelope me-2"></i>
              <a [href]="'mailto:' + contact()?.email" class="text-muted">
                {{ contact()?.email }}
              </a>
            </span>
          }
        </div>
      </div>
      <div class="col-md-4">
        @if (contact()?.website) {
          <div
            class="top-links gap-3 d-flex justify-content-end align-items-center"
          >
            <!-- <a
            href="https://www.luxor.edu.eg"
            target="_blank"
            class="text-primary-custom text-decoration-none fw-semibold"
          >
            <i class="fa fa-university me-1"></i>University
          </a> -->
            <a
              class="mt-3 mt-md-0 btn btn-primary btn-sm"
              [href]="contact()?.website"
              target="_blank"
            >
              العربية
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</div>
