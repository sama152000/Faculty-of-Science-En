<div class="quick-nav-sidebar">
  <div class="nav-items">
    @for (item of quickNavItems; track item.id) {
      <div
        class="nav-item"
        [routerLink]="item.route"
        [title]="item.label"
        [style.--item-color]="item.color"
      >
        <i [class]="item.icon"></i>
        <span class="nav-label">{{ item.label }}</span>
      </div>
    }
  </div>
</div>
