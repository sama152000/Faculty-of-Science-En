<div class="programs-sidebar card-custom">
  <h4 class="sidebar-title">
    <i class="fas fa-graduation-cap me-2"></i>
    Study Programs
  </h4>

  <!-- Loading State -->
  @if (loading()) {
    <div class="loading-list">
      @for (i of [1, 2, 3, 4]; track i) {
        <p-skeleton height="5rem" styleClass="mb-2" />
      }
    </div>
  }

  <!-- Programs List -->
  @if (!loading()) {
    <ul class="programs-list">
      @for (program of programs(); track program.id) {
        <li>
          <button
            class="program-btn"
            [class.active]="isSelected(program.id)"
            (click)="onSelectProgram(program)"
          >
            <div class="program-icon">
              @if (getProgramImage(program)) {
                <img
                  [src]="getProgramImage(program)"
                  [alt]="program.pageTitle"
                  class="program-thumb"
                />
              } @else {
                <i class="fas fa-graduation-cap"></i>
              }
            </div>
            <div class="program-info">
              <h6 class="program-name">{{ program.pageTitle }}</h6>
              @if (getShortDescription(program)) {
                <div
                  style="
                    margin: 0 0 0.8rem 0;
                    font-size: 0.85rem;
                    opacity: 0.8;
                    line-height: 1.3;
                  "
                  [innerHTML]="
                    (program.about
                      | cleanHtml
                        : {
                            stripStyles: true,
                            stripClasses: true,
                            preserveLineBreaks: true,
                          }
                      | slice: 0 : 80) + '...'
                  "
                ></div>
              }
            </div>
          </button>
        </li>
      }
    </ul>
  }

  <!-- Empty State -->
  @if (!loading() && programs().length === 0) {
    <div class="text-center text-muted py-4">
      <i class="mb-2 fas fa-graduation-cap fa-2x"></i>
      <p>No programs available</p>
    </div>
  }
</div>
`
