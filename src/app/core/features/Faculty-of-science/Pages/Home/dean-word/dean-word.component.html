<section id="dean" class="bg-beige-custom dean-section section-padding" dir="ltr">
  <div class="container-fluid">
    <!-- Loading State -->
    @if (loading) {
    <div class="row align-items-center">
      <div class="mb-4 mb-lg-0 col-lg-5">
        <div class="text-center dean-image">
          <div class="rounded shadow-lg skeleton-image" style="
              width: 400px;
              height: 400px;
              background: linear-gradient(
                90deg,
                #f0f0f0 25%,
                #e0e0e0 50%,
                #f0f0f0 75%
              );
              animation: shimmer 1.5s infinite;
            "></div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="dean-content">
          <div class="mb-4 skeleton-title" style="
              height: 40px;
              width: 200px;
              background: linear-gradient(
                90deg,
                #f0f0f0 25%,
                #e0e0e0 50%,
                #f0f0f0 75%
              );
              animation: shimmer 1.5s infinite;
              border-radius: 4px;
            "></div>
          <div class="mb-3 skeleton-text" style="
              height: 100px;
              background: linear-gradient(
                90deg,
                #f0f0f0 25%,
                #e0e0e0 50%,
                #f0f0f0 75%
              );
              animation: shimmer 1.5s infinite;
              border-radius: 4px;
            "></div>
          <div class="skeleton-name" style="
              height: 24px;
              width: 250px;
              background: linear-gradient(
                90deg,
                #f0f0f0 25%,
                #e0e0e0 50%,
                #f0f0f0 75%
              );
              animation: shimmer 1.5s infinite;
              border-radius: 4px;
            "></div>
        </div>
      </div>
    </div>
    }

    <!-- Content State -->
    @if (!loading) {
    <a [routerLink]="['/about']">
      <div class="row align-items-center">
        <!-- Dean Image -->
        <div class="mb-4 mb-lg-0 col-lg-5">
          <div class="text-center dean-image">
            <img [src]="deanImage" [alt]="deanName" class="rounded shadow-lg img-fluid hover-scale"
              style="max-width: 400px; width: 100%" (error)="$event.target.src = './assets/deanp.jpg'" />
          </div>
        </div>

        <!-- Dean Content -->
        <div class="col-lg-7">
          <div class="dean-content">
            <h2 class="text-dark-blue mb-4 section-title section-title-left">
              Dean's Message
            </h2>

            <div class="text-primary-custom mb-4 lead" [innerHTML]="
                (deanMessage
                  | cleanHtml
                    : {
                        stripStyles: true,
                        stripClasses: false,
                        preserveLineBreaks: true
                      }
                  | slice : 0 : 300) +
                '&nbsp;' +
                '....'
              "></div>

            <div class="mt-4 dean-signature">
              <h4 class="text-dark-blue mb-1">{{ deanName }}</h4>
              <p class="text-muted mb-0">{{ deanTitle }}</p>
            </div>
          </div>
        </div>
      </div>
    </a>
    }
  </div>
</section>
