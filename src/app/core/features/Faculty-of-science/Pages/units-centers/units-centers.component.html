<section class="units-centers-section">
  <div class="container-fluid">
    <h2 class="section-title">Units & Centers</h2>

    <!-- Tab Navigation -->
    <div class="tab-navigation card-custom mb-4">
      <div class="tab-buttons">

        <button class="tab-btn" [class.active]="isActiveTab(unitsCategorySlug())"
          (click)="setActiveTab(unitsCategorySlug())">
          <i class="fas fa-building me-2"></i>
          Units
        </button>

        <button class="tab-btn" [class.active]="isActiveTab(centersCategorySlug())"
          (click)="setActiveTab(centersCategorySlug())">
          <i class="fas fa-university me-2"></i>
          Research Centers
        </button>

      </div>
    </div>

    <!-- Tab Content -->
    @if (isActiveTab(unitsCategorySlug())) {
    <app-units [categorySlug]="unitsCategorySlug()" />
    }

    @if (isActiveTab(centersCategorySlug())) {
    <app-centers [categorySlug]="centersCategorySlug()" />
    }

  </div>
</section>
