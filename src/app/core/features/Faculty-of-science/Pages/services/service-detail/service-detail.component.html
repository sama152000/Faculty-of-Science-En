<section class="service-detail-section">
  <div class="container-fluid">

    <!-- Back Button -->
    <button class="back-btn" (click)="goBack()">
      <i class="fas fa-arrow-left me-2"></i>
      Back to Services
    </button>

    <!-- Loading State -->
    @if (loading()) {
    <div class="detail-skeleton">

      <div class="header-skeleton card-custom mb-4 p-4">
        <div class="d-flex align-items-center gap-3">
          <p-skeleton shape="circle" height="100px" width="100px" />
          <div class="flex-grow-1">
            <p-skeleton height="2rem" width="60%" styleClass="mb-3" />
            <p-skeleton height="1rem" width="80%" />
          </div>
        </div>
      </div>

      <div class="card-custom p-4">
        <p-skeleton height="1.5rem" width="30%" styleClass="mb-4" />
        <p-skeleton height="1rem" width="100%" styleClass="mb-2" />
        <p-skeleton height="1rem" width="90%" styleClass="mb-2" />
        <p-skeleton height="1rem" width="70%" />
      </div>

    </div>
    }

    <!-- Error State -->
    @if (error()) {
    <div class="error-state text-center py-5">
      <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
      <h4 class="mb-3">{{ error() }}</h4>

      <button class="btn btn-primary" (click)="retry()">
        <i class="fas fa-refresh me-2"></i>
        Try Again
      </button>
    </div>
    }

    <!-- Success State -->
    @if (!loading() && !error() && service(); as svc) {
    <div class="service-detail-content">

      <!-- Service Header -->
      <div class="service-header card-custom mb-4">
        <div class="header-content">

          <div class="service-icon-large">
            @if (svc.iconPath && svc.iconPath.startsWith('http')) {
            <img [src]="svc.iconPath" [alt]="svc.title" class="service-img-large" />
            } @else {
            <i [class]="getServiceIcon(svc)"></i>
            }
          </div>

          <div class="header-info">
            <h1 class="service-title">{{ svc.title }}</h1>

            @if (svc.isActive) {
            <p-tag value="Active" severity="success" />
            } @else {
            <p-tag value="Inactive" severity="danger" />
            }

          </div>

        </div>
      </div>

      <!-- Service Details -->
      @if (svc.description) {
      <div class="content-section card-custom mb-4">

        <div class="section-header">
          <h3>
            <i class="fas fa-info-circle text-primary-custom me-3"></i>
            Service Details
          </h3>
        </div>

        <div class="content-body" [innerHTML]="svc.description | cleanHtml">
        </div>

      </div>
      }

    </div>
    }

  </div>
</section>
